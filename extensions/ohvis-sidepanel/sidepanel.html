<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OHVIS</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <span class="dot" id="status-dot" title="연결 확인 중…" aria-hidden="true"></span>
    <strong class="brand">OHVIS</strong>
    <button type="button" class="chip" id="chip-approvals" aria-expanded="false" aria-controls="sheet">승인 <span class="chip-count" id="approvals-summary-count">0</span></button>
    <button type="button" class="chip" id="chip-tasks" aria-expanded="false" aria-controls="sheet">작업 <span class="chip-count" id="tasks-summary-count">0</span></button>
    <span class="status-text" id="status-text" role="status">연결 확인 중…</span>
    <div class="menu-wrap">
      <button type="button" class="icon-btn" id="btn-menu" aria-label="더보기" aria-haspopup="menu" aria-expanded="false" aria-controls="menu">⋯</button>
      <div class="menu" id="menu" role="menu" hidden>
        <button type="button" role="menuitem" id="btn-refresh">새로고침</button>
        <button type="button" role="menuitem" id="btn-chat-tab">새 탭에서 열기</button>
        <button type="button" role="menuitem" id="btn-sheet-only">승인·작업만 보기</button>
      </div>
    </div>
  </header>

  <section class="login-banner" id="login-banner" hidden>
    <p>OHVIS 에 로그인하면 승인 대기와 진행 중 작업이 여기에 표시됩니다.</p>
    <button type="button" class="btn primary" id="btn-login">OHVIS 에 로그인</button>
  </section>

  <main id="main">
    <section class="chat-panel" id="chat-panel" aria-label="OHVIS 채팅">
      <div class="chat-notice" id="chat-notice" hidden>
        <span>채팅을 불러오지 못했거나 로그인 확인이 되지 않았습니다. 계속되면 ⋯ 메뉴의 '새 탭에서 열기'를 이용하세요.</span>
        <button type="button" class="btn small" id="btn-chat-reconnect">다시 연결</button>
      </div>
      <div id="chat-body"></div>
    </section>
  </main>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="false" aria-labelledby="sheet-title" tabindex="-1" hidden>
    <div class="sheet-head">
      <strong id="sheet-title">승인·작업</strong>
      <button type="button" class="btn small" id="btn-sheet-close">닫기</button>
    </div>
    <div class="sheet-body">
      <section class="sheet-section" id="sheet-approvals" aria-label="승인 대기">
        <h2>승인 대기 <span class="muted" id="approvals-count"></span></h2>
        <div id="approvals" class="stack"></div>
      </section>
      <section class="sheet-section" id="sheet-tasks" aria-label="진행 중 작업">
        <h2>진행 작업 <span class="muted" id="tasks-count"></span></h2>
        <div id="tasks" class="stack"></div>
      </section>
    </div>
  </section>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
