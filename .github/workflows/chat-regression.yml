name: Chat regression gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  chat-wp00:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - name: Verify Chromium can launch
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=['--no-sandbox'])
              page = browser.new_page()
              page.set_content('<p>Chromium ready</p>')
              assert page.locator('p').inner_text() == 'Chromium ready'
              browser.close()
          PY
      - run: npm run test:chat:ci
        env:
          CHAT_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
